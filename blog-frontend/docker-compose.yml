services:
  blog:
    image: nginx:stable          # 国内服务器拉取慢可换成阿里云镜像，如 registry.cn-hangzhou.aliyuncs.com/xfg-studio/nginx:latest
    container_name: my-blog
    restart: always
    ports:
      - '80:80'
      - '443:443'                # HTTPS
    volumes:
      - ./dist:/usr/share/nginx/html                          # 挂载构建产物
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf   # 挂载 nginx 配置
      - ./certs:/certs:ro                                      # 挂载 SSL 证书（只读）
