server {
    listen 80 default_server;
    server_name grey666.com www.grey666.com;   # apex + www；default_server 保证 DNS 没生效前用 IP 也能访问

    root /usr/share/nginx/html;
    index index.html;

    # history 路由兜底：刷新/深链找不到文件时回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== 后端 API 代理（后端部署后取消注释启用）=====
    # location /api/ {
    #     proxy_pass http://backend:8894;     # /api/blog/* -> 后端 /api/blog/*
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
}
