# admin 管理端 HTTPS（8443 端口，复用 grey666.com 证书）
server {
    listen 443 ssl;
    server_name grey666.com;

    # SSL 证书（与 blog 同一份 grey666.com 证书，证书只认域名不认端口，8443 也匹配）
    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # history 路由兜底（admin 用 createWebHistory）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== 后端 API 代理：/api/* -> 后端 8894（context-path=/api）=====
    # admin 用 /api/admin、/api/app、/api/upload，都在 /api 下，一个 location 全包
    # proxy_pass 不带末尾斜杠，保留 /api 前缀传给后端
    location /api/ {
        proxy_pass http://host.docker.internal:8894;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 注：图片 URL 是后端生成的绝对地址 https://grey666.com/minio/...（走 443 端口），
    # 由 blog 的 nginx /minio/ 反代处理，admin 无需配 /minio/。
}
