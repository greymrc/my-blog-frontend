services:
  admin:
    image: nginx:stable
    container_name: my-blog-admin
    restart: always
    ports:
      - '8898:443'                          # HTTPS 非标端口（blog 已占 443）
    extra_hosts:
      - "host.docker.internal:host-gateway" # nginx 容器经此访问宿主机后端 8894
    volumes:
      - ./dist:/usr/share/nginx/html                          # 挂载构建产物
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf   # 挂载 nginx 配置
      - ./certs:/certs:ro                                      # 挂载 SSL 证书（只读，与 blog 同一份 grey666.com 证书）
